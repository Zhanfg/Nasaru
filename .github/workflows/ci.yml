name: Core CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  android-framework-observer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build DEX helper
        run: sh android/framework-observer/build.sh
      - name: Verify DEX payload
        run: unzip -l build/framework-observer/nasaru-framework-observer.jar | grep -q 'classes.dex'
      - uses: actions/upload-artifact@v4
        with:
          name: nasaru-framework-observer-${{ github.sha }}
          path: build/framework-observer/nasaru-framework-observer.jar
          if-no-files-found: error
          retention-days: 30

  training-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m compileall -q training
      - run: python training/train_student.py --dataset training/sample-data/generic-smoke.jsonl --output-dir build/model
      - run: python training/evaluate_model.py --model build/model/student.json --dataset training/sample-data/generic-smoke.jsonl --output build/model/metrics.json
      - run: python training/quality_gate.py --metrics build/model/metrics.json --runtime-model build/model/student.nsm
